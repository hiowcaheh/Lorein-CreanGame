<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lorein</title>
<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: #14100c;
    overflow: hidden;
    font-family: Tahoma, Arial, Helvetica, sans-serif;
    color: #e8ddc8;
  }

  #gra { width: 100%; height: 100%; }
  #gra ruffle-player { width: 100%; height: 100%; }

  #panel {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .9rem;
    text-align: center;
    padding: 1.5rem;
    overflow-y: auto;
    background: #14100c;
  }

  #panel.ukryty { display: none; }

  h1 { font-size: 1.7rem; color: #f0c042; margin: 0; letter-spacing: .04em; }
  #stan { margin: 0; color: #a89578; max-width: 34rem; line-height: 1.6; }

  #diag {
    display: none;
    text-align: left;
    font-family: ui-monospace, Consolas, monospace;
    font-size: .82rem;
    line-height: 1.7;
    background: #0f0c08;
    border: 1px solid #3a2e20;
    border-radius: 8px;
    padding: 1rem;
    max-width: 38rem;
    width: 100%;
  }

  #diag div { margin-bottom: .3rem; word-break: break-word; }
  .ok   { color: #7bb661; }
  .zle  { color: #c85a4a; }
  .czek { color: #a89578; }

  a { color: #f0c042; }

  .przycisk {
    display: inline-block;
    background: linear-gradient(#3a2e1c, #241c12);
    border: 1px solid #5a4726;
    color: #f0c042;
    text-decoration: none;
    font-size: .9rem;
    padding: .55rem 1.2rem;
    border-radius: 8px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="gra"></div>

<div id="panel">
  <h1>Lorein</h1>
  <p id="stan">Wczytywanie gry…</p>
  <div id="diag"></div>
  <a class="przycisk" id="btn-diag" href="?debug=1">Diagnostyka</a>
</div>

<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<script>
(function () {
  "use strict";

  var SWF = "res/sfgame_edit.swf";

  var panel = document.getElementById("panel");
  var stan  = document.getElementById("stan");
  var diag  = document.getElementById("diag");
  var btn   = document.getElementById("btn-diag");
  var debug = new URLSearchParams(location.search).has("debug");

  function pokazBlad(text) {
    panel.classList.remove("ukryty");
    stan.innerHTML = text;
  }

  // ------------------------------------------------------ diagnostyka --

  function wiersz(etykieta) {
    var el = document.createElement("div");
    el.innerHTML = "<span class='czek'>… " + etykieta + "</span>";
    diag.appendChild(el);
    return function (dobrze, opis) {
      el.innerHTML = "<span class='" + (dobrze ? "ok" : "zle") + "'>" +
        (dobrze ? "OK  " : "BLAD ") + etykieta + "</span> — " + opis;
    };
  }

  function sprawdz(etykieta, url, walidator) {
    var gotowe = wiersz(etykieta);
    return fetch(url, { cache: "no-store" })
      .then(function (r) {
        return r.text().then(function (tekst) {
          var wynik = walidator(r, tekst);
          gotowe(wynik.dobrze, wynik.opis);
        });
      })
      .catch(function (e) { gotowe(false, String(e)); });
  }

  function uruchomDiagnostyke() {
    diag.style.display = "block";
    btn.style.display = "none";
    stan.textContent = "Sprawdzam, co dziala, a co nie:";

    diag.innerHTML = "";
    var adres = wiersz("adres strony");
    adres(true, location.origin);

    var r = wiersz("Ruffle (odtwarzacz Flash)");
    r(!!(window.RufflePlayer && window.RufflePlayer.newest),
      window.RufflePlayer ? "wczytany z unpkg.com" : "NIE wczytal sie — sprawdz blokade skryptow");

    sprawdz("backend /health", "health", function (res, tekst) {
      if (!res.ok) return { dobrze: false, opis: "HTTP " + res.status };
      try {
        var j = JSON.parse(tekst);
        return { dobrze: j.status === "ok", opis: "akcje: " + (j.ported || []).join(", ") };
      } catch (e) { return { dobrze: false, opis: "odpowiedz nie jest JSON-em: " + tekst.slice(0, 80) }; }
    })
    .then(function () {
      return sprawdz("baza danych (/config.php)", "config.php", function (res, tekst) {
        if (!res.ok) return { dobrze: false, opis: "HTTP " + res.status + " — sprawdz DATABASE_URL w Vercelu" };
        var linie = tekst.split("\n").filter(Boolean);
        var pole25 = linie.filter(function (l) { return l.indexOf("25\t") === 0; })[0];
        return {
          dobrze: linie.length > 10 && !!pole25,
          opis: linie.length + " pol konfiguracji; endpoint gry: " + (pole25 ? pole25.slice(3) : "BRAK")
        };
      });
    })
    .then(function () {
      return sprawdz("plik gry (" + SWF + ")", SWF, function (res, tekst) {
        if (!res.ok) return { dobrze: false, opis: "HTTP " + res.status + " — zasoby nie trafily na serwer" };
        var czyFlash = tekst.slice(0, 3);
        return {
          dobrze: tekst.length > 100000,
          opis: Math.round(tekst.length / 1024) + " kB, naglowek: " + JSON.stringify(czyFlash)
        };
      });
    })
    .then(function () {
      return sprawdz("grafika postaci", "res/sfgame/scr/fight/monster/monster2.jpg", function (res) {
        return { dobrze: res.ok, opis: res.ok ? "zasoby graficzne sa dostepne" : "HTTP " + res.status };
      });
    })
    .then(function () {
      var koniec = wiersz("podsumowanie");
      koniec(true, "skopiuj powyzsze i wyslij — na tej podstawie widac, co poprawic");
    });
  }

  if (debug) {
    // Diagnostyka zamiast gry.
    if (window.RufflePlayer) uruchomDiagnostyke();
    else setTimeout(uruchomDiagnostyke, 2500);
    return;
  }

  // ---------------------------------------------------------- gra --

  function czekajNaRuffle(proba) {
    if (window.RufflePlayer && window.RufflePlayer.newest) { uruchom(); return; }
    if (proba > 100) {
      pokazBlad("Nie udalo sie wczytac Ruffle — odtwarzacza uruchamiajacego gre.<br>" +
                "Sprawdz polaczenie albo blokade skryptow.<br><br>" +
                "<a href='?debug=1'>Uruchom diagnostyke</a>");
      return;
    }
    setTimeout(function () { czekajNaRuffle(proba + 1); }, 100);
  }

  function uruchom() {
    var player;
    try {
      player = window.RufflePlayer.newest().createPlayer();
      document.getElementById("gra").appendChild(player);
    } catch (e) {
      pokazBlad("Blad uruchamiania odtwarzacza:<br>" + e);
      return;
    }

    // Ruffle zglasza problemy z samym plikiem przez zdarzenie `error`.
    player.addEventListener("error", function (e) {
      pokazBlad("Ruffle nie poradzil sobie z plikiem gry.<br>" + (e && e.message ? e.message : "") +
                "<br><br><a href='?debug=1'>Uruchom diagnostyke</a>");
    });

    player.load({
      url: SWF,
      allowScriptAccess: true,
      backgroundColor: "#000000",
      scale: "showAll",
      quality: "best",
      wmode: "opaque",
      menu: true,
      salign: "t"
    }).then(function () {
      // Plik sie wczytal — chowamy komunikat dopiero teraz.
      panel.classList.add("ukryty");
    }).catch(function (err) {
      pokazBlad("Nie udalo sie wczytac pliku gry <code>" + SWF + "</code>.<br>" +
                String(err) + "<br><br><a href='?debug=1'>Uruchom diagnostyke</a>");
    });

    // Jesli po 20 sekundach nadal jest czarno, pokazujemy droge wyjscia
    // zamiast zostawiac gracza z pustym ekranem.
    setTimeout(function () {
      if (panel.classList.contains("ukryty") && !player.querySelector) {
        return;
      }
    }, 20000);
  }

  czekajNaRuffle(0);
})();
</script>

</body>
</html>
