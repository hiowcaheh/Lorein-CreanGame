<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lorein</title>
<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    font-family: Tahoma, Arial, Helvetica, sans-serif;
    color: #ffd9aa;
  }

  #gra {
    width: 100%;
    height: 100%;
  }

  #gra ruffle-player {
    width: 100%;
    height: 100%;
  }

  #komunikat {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .75rem;
    text-align: center;
    padding: 1.5rem;
  }

  #komunikat h1 {
    font-size: 1.6rem;
    color: #f0c042;
    margin: 0;
  }

  #komunikat p {
    margin: 0;
    max-width: 32rem;
    line-height: 1.6;
    color: #a89578;
  }

  #komunikat code {
    background: #1a140d;
    border: 1px solid #3a2e20;
    border-radius: 4px;
    padding: .15rem .4rem;
    color: #e8ddc8;
  }
</style>
</head>
<body>

<div id="gra"></div>

<div id="komunikat">
  <h1>Lorein</h1>
  <p id="komunikat-tresc">Wczytywanie gry…</p>
</div>

<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<script>
(function () {
  "use strict";

  const kontener = document.getElementById("gra");
  const komunikat = document.getElementById("komunikat");
  const tresc = document.getElementById("komunikat-tresc");

  function bladKrytyczny(text) {
    komunikat.style.display = "flex";
    tresc.innerHTML = text;
  }

  // Ruffle laduje sie asynchronicznie z CDN-u — czekamy, az sie zglosi.
  function czekajNaRuffle(proba) {
    if (window.RufflePlayer && window.RufflePlayer.newest) {
      uruchom();
      return;
    }
    if (proba > 100) {
      bladKrytyczny(
        "Nie udalo sie wczytac Ruffle — odtwarzacza, ktory uruchamia gre w przegladarce.<br>" +
        "Sprawdz polaczenie z siecia albo blokade skryptow."
      );
      return;
    }
    setTimeout(function () { czekajNaRuffle(proba + 1); }, 100);
  }

  function uruchom() {
    try {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      kontener.appendChild(player);

      player.addEventListener("loadeddata", function () {
        komunikat.style.display = "none";
      });

      // Klient sam pobiera `config.php` wzgledem tej strony, wiec backend
      // musi odpowiadac pod tym samym adresem co ten plik.
      player.load({
        url: "res/sfgame_edit.swf",
        allowScriptAccess: true,
        backgroundColor: "#000000",
        scale: "showAll",
        quality: "best",
        wmode: "opaque",
        menu: true,
        salign: "t"
      }).catch(function (err) {
        bladKrytyczny(
          "Nie udalo sie wczytac pliku gry <code>res/sfgame_edit.swf</code>.<br>" +
          "Sprawdz, czy zasoby zostaly wgrane razem z aplikacja.<br><br>" +
          String(err)
        );
      });
    } catch (err) {
      bladKrytyczny("Blad uruchamiania odtwarzacza:<br>" + String(err));
    }
  }

  czekajNaRuffle(0);
})();
</script>

</body>
</html>
