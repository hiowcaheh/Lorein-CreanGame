<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lorein</title>
<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    overscroll-behavior: none;
    font-family: Tahoma, Arial, Helvetica, sans-serif;
    color: #e8ddc8;
    /* Bez podswietlania przy dotknieciu — gra ma wygladac jak aplikacja. */
    -webkit-tap-highlight-color: transparent;
  }

  /* `dvh` liczy sie wzgledem realnie widocznej wysokosci, wiec pasek adresu
     przegladarki na telefonie nie obcina dolu ekranu. */
  #gra {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;

    /* Po dodaniu strony do ekranu poczatkowego iOS oddaje cala powierzchnie
       ekranu — razem z paskiem pod wyciecie aparatu i belka gestu. W poziomie
       wyciecie wypada z boku i przykryloby menu gry. Marginesy bezpieczne sa
       zerowe dopoki nie sa potrzebne, wiec nic tu nie tracimy w przegladarce. */
    box-sizing: border-box;
    padding:
      env(safe-area-inset-top, 0px)
      env(safe-area-inset-right, 0px)
      env(safe-area-inset-bottom, 0px)
      env(safe-area-inset-left, 0px);
  }

  #gra ruffle-player {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Panel pokazuje sie WYLACZNIE przy bledzie albo w trybie diagnostyki. */
  #panel {
    display: none;
    position: fixed;
    inset: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .9rem;
    text-align: center;
    padding: 1.5rem;
    overflow-y: auto;
    background: #14100c;
    z-index: 10;
  }

  #panel.widoczny { display: flex; }

  h1 { font-size: 1.5rem; color: #f0c042; margin: 0; }
  #stan { margin: 0; color: #a89578; max-width: 34rem; line-height: 1.6; }

  #diag {
    text-align: left;
    font-family: ui-monospace, Consolas, monospace;
    font-size: .82rem;
    line-height: 1.7;
    background: #0f0c08;
    border: 1px solid #3a2e20;
    border-radius: 8px;
    padding: 1rem;
    max-width: 38rem;
    width: 100%;
  }

  #diag:empty { display: none; }
  #diag div { margin-bottom: .3rem; word-break: break-word; }
  .ok { color: #7bb661; }
  .zle { color: #c85a4a; }
  .czek { color: #a89578; }

  a { color: #f0c042; }

  /* Pasek awaryjny do pisania — pokazuje sie tylko wtedy, gdy gra czeka na
     tekst, a klawiatura mimo wszystko sie nie otworzyla. */
  #pisz {
    display: none;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: .9rem 1rem calc(.9rem + env(safe-area-inset-bottom, 0px));
    background: #1c1710;
    border-top: 2px solid #6b5426;
    color: #f0c042;
    font-size: 1.05rem;
    text-align: center;
    z-index: 5;
    -webkit-user-select: none;
    user-select: none;
  }

  #pisz.widoczny { display: block; }
</style>
</head>
<body>

<div id="gra"></div>

<div id="pisz">⌨  Dotknij tutaj, zeby pisac</div>

<div id="panel">
  <h1>Lorein</h1>
  <p id="stan"></p>
  <div id="diag"></div>
</div>

<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<script>
(function () {
  "use strict";

  var SWF = "res/sfgame_edit.swf";

  var panel = document.getElementById("panel");
  var stan = document.getElementById("stan");
  var diag = document.getElementById("diag");
  var debug = new URLSearchParams(location.search).has("debug");

  /** `?proporcje=1` — wierne proporcje zamiast rozciagniecia na caly ekran. */
  var proporcje = new URLSearchParams(location.search).has("proporcje");

  function pokazBlad(text) {
    panel.classList.add("widoczny");
    stan.innerHTML = text;
  }

  // ------------------------------------------------------ diagnostyka --

  function wiersz(etykieta) {
    var el = document.createElement("div");
    el.innerHTML = "<span class='czek'>… " + etykieta + "</span>";
    diag.appendChild(el);
    return function (dobrze, opis) {
      el.innerHTML = "<span class='" + (dobrze ? "ok" : "zle") + "'>" +
        (dobrze ? "OK  " : "BLAD ") + etykieta + "</span> — " + opis;
    };
  }

  /**
   * Kazdy test ma wlasny limit czasu i wlasny wiersz.
   *
   * Testy ida ROWNOLEGLE — wczesniej szly po kolei i zawieszony `/health`
   * blokowal wszystkie ponizej, wiec nie bylo widac, czy dziala cokolwiek
   * innego. Teraz nawet gdy jeden test wisi, reszta zdazy sie wypisac.
   */
  function sprawdz(etykieta, url, walidator, limitMs) {
    var gotowe = wiersz(etykieta);
    var limit = limitMs || 12000;
    var rozstrzygniete = false;
    var start = Date.now();

    var licznik = setTimeout(function () {
      if (!rozstrzygniete) {
        rozstrzygniete = true;
        gotowe(false, "przekroczono " + (limit / 1000) + " s — brak odpowiedzi");
      }
    }, limit);

    return fetch(url, { cache: "no-store" })
      .then(function (r) {
        return r.text().then(function (tekst) {
          if (rozstrzygniete) return;
          rozstrzygniete = true;
          clearTimeout(licznik);
          var w = walidator(r, tekst);
          // Czas odpowiedzi jest tu najwazniejsza liczba — po nim widac,
          // czy backend i baza stoja w tym samym regionie.
          gotowe(w.dobrze, (Date.now() - start) + " ms — " + w.opis);
        });
      })
      .catch(function (e) {
        if (rozstrzygniete) return;
        rozstrzygniete = true;
        clearTimeout(licznik);
        gotowe(false, String(e));
      });
  }

  function uruchomDiagnostyke() {
    panel.classList.add("widoczny");
    stan.textContent = "Sprawdzam, co dziala, a co nie:";
    diag.innerHTML = "";

    wiersz("wersja strony")(true, "__WERSJA__");
    wiersz("adres strony")(true, location.origin);
    wiersz("Ruffle (odtwarzacz Flash)")(
      !!(window.RufflePlayer && window.RufflePlayer.newest),
      window.RufflePlayer ? "wczytany" : "NIE wczytal sie z unpkg.com"
    );

    // Najpierw testy nietykajace bazy — daja wynik od razu.
    var testy = [
      sprawdz("plik gry", SWF, function (res, tekst) {
        if (!res.ok) return { dobrze: false, opis: "HTTP " + res.status };
        return { dobrze: tekst.length > 100000, opis: Math.round(tekst.length / 1024) + " kB" };
      }, 20000),

      sprawdz("grafika", "res/sfgame/scr/fight/monster/monster2.jpg", function (res) {
        return { dobrze: res.ok, opis: res.ok ? "zasoby dostepne" : "HTTP " + res.status };
      }, 15000),

      sprawdz("goła funkcja (/api/ping)", "api/ping", function (res, tekst) {
        if (!res.ok) return { dobrze: false, opis: "HTTP " + res.status + " — " + tekst.slice(0, 80) };
        return { dobrze: true, opis: tekst.slice(0, 60) };
      }, 15000),

      sprawdz("funkcja wprost (/api/index)", "api/index?probe=1", function (res, tekst) {
        if (!res.ok) return { dobrze: false, opis: "HTTP " + res.status + " — " + tekst.slice(0, 80) };
        return { dobrze: true, opis: "funkcja startuje" };
      }, 15000),

      sprawdz("funkcja zyje (/version)", "version", function (res, tekst) {
        if (!res.ok) return { dobrze: false, opis: "HTTP " + res.status + " — " + tekst.slice(0, 90) };
        return { dobrze: true, opis: tekst.replace(/\n/g, " | ") };
      }, 15000),

      sprawdz("backend bez bazy (/req.php)", "req.php?req=" + new Array(33).join("0") + "999", function (res, tekst) {
        if (!res.ok) return { dobrze: false, opis: "HTTP " + res.status + " — " + tekst.slice(0, 90) };
        return { dobrze: true, opis: "funkcja odpowiada: " + JSON.stringify(tekst.slice(0, 20)) };
      }, 20000),

      sprawdz("backend + baza (/health)", "health", function (res, tekst) {
        if (!res.ok) return { dobrze: false, opis: "HTTP " + res.status + " — " + tekst.slice(0, 110) };
        try {
          var j = JSON.parse(tekst);
          return {
            dobrze: j.database === "ok",
            opis: "baza: " + j.database +
                  " | region: " + (j.region || "?") +
                  " | pierwsze zapytanie: " + j.czasPierwszegoZapytaniaMs + " ms" +
                  " | kolejne: " + j.czasKolejnegoZapytaniaMs + " ms"
          };
        } catch (e) {
          return { dobrze: false, opis: "odpowiedz nie jest JSON-em: " + tekst.slice(0, 90) };
        }
      }, 25000),

      sprawdz("konfiguracja klienta (/config.php)", "config.php", function (res, tekst) {
        if (!res.ok) return { dobrze: false, opis: "HTTP " + res.status + " — " + tekst.slice(0, 110) };
        var linie = tekst.split("\n").filter(Boolean);
        var p25 = linie.filter(function (l) { return l.indexOf("25\t") === 0; })[0];
        return { dobrze: linie.length > 10 && !!p25, opis: linie.length + " pol; endpoint: " + (p25 ? p25.slice(3) : "BRAK") };
      }, 25000)
    ];

    Promise.all(testy).then(function () {
      wiersz("podsumowanie")(true, "wszystkie testy zakonczone — skopiuj powyzsze i wyslij");
    });
  }

  // ------------------------------------------- klawiatura ekranowa --

  /**
   * Odtwarzacz, gdy juz powstanie.
   */
  var odtwarzacz = null;

  /**
   * Dlaczego klawiatura wyskakiwala "raz tak, raz nie".
   *
   * Ruffle rysuje gre na plotnie, wiec pola tekstowe Flasha nie sa polami
   * HTML — przegladarka sama z siebie klawiatury nie pokaze. Ruffle ma na to
   * ukryty `<input id="virtual-keyboard">` w swoim cieniu (shadow DOM, tryb
   * otwarty, wiec mozemy go dosiegnac) i ustawia na nim fokus, gdy gra
   * zglosi wejscie w pole tekstowe. Jego wlasny kod robi to tak:
   *
   *     if (this.instance?.has_focus()) {
   *         this.virtualKeyboard.focus({ preventScroll: true });   // od razu
   *     } else {
   *         setTimeout(() => this.virtualKeyboard.focus(...), 0);  // pozniej
   *     }
   *
   * Obie galezie sa na iOS zawodne. Safari otwiera klawiature WYLACZNIE
   * w bezposredniej, synchronicznej reakcji na dotkniecie. Tymczasem Ruffle
   * przekazuje klikniecie do gry dopiero przy nastepnej klatce (gra chodzi
   * w 25 kl./s, czyli do 40 ms pozniej), wiec zanim gra w ogole zauwazy, ze
   * gracz trafil w pole tekstowe, gest juz sie skonczyl. Stad losowosc.
   *
   * Dlatego nie polegamy na tej sciezce w ogole. Robimy dwie rzeczy:
   *
   *   1. Przy KAZDYM dotknieciu ustawiamy fokus na ukrytym polu Ruffle
   *      natychmiast, jeszcze w trakcie gestu. Jesli dotkniecie trafilo
   *      w pole tekstowe — klawiatura jest juz otwarta, zanim gra zdazy
   *      o nia poprosic. Jesli nie trafilo, po chwili oddajemy fokus
   *      z powrotem grze i klawiatura znika, zanim zdazy sie pokazac.
   *
   *   2. Gdyby mimo wszystko nie wyszlo — a gra CZEKA na tekst — pokazujemy
   *      na dole pasek "Dotknij tutaj, zeby pisac". Dotkniecie paska jest juz
   *      zwyklym dotknieciem zwyklego pola HTML, wiec klawiatura otwiera sie
   *      bez zadnych sztuczek. To droga awaryjna, ktora nie moze zawiesc.
   *
   * Wpisane znaki i tak obsluguje Ruffle: nasluchuje `input` na swoim polu
   * i przepisuje kazda litere do gry jako zdarzenia klawiatury.
   */

  var pasekPisania = document.getElementById("pisz");

  function podepnijKlawiature(player) {
    var cien = player.shadowRoot;
    if (!cien) return;

    var pole = cien.getElementById("virtual-keyboard");
    var kontener = cien.getElementById("container");
    if (!pole) return;

    // Fokus wolany z pominieciem naszej podmiany nizej.
    function ustawFokus() {
      try { HTMLElement.prototype.focus.call(pole, { preventScroll: true }); }
      catch (e) { try { HTMLElement.prototype.focus.call(pole); } catch (e2) { /* trudno */ } }
    }

    // Podmieniamy `focus` na polu Ruffle, zeby wiedziec, KIEDY gra prosi
    // o klawiature. To jedyny sygnal, jaki Ruffle wystawia na zewnatrz.
    var graChceTekstu = false;
    pole.focus = function (opcje) {
      graChceTekstu = true;
      ukryjPasek();
      try { HTMLElement.prototype.focus.call(pole, opcje); }
      catch (e) { HTMLElement.prototype.focus.call(pole); }
    };

    function polejestAktywne() {
      return cien.activeElement === pole;
    }

    /** Czy klawiatura systemowa faktycznie sie pokazala. */
    function klawiaturaOtwarta() {
      if (!window.visualViewport) return false;
      return window.visualViewport.height < window.innerHeight * 0.85;
    }

    function oddajFokusGrze() {
      if (!polejestAktywne()) return;
      if (kontener) {
        try { kontener.focus({ preventScroll: true }); } catch (e) { kontener.focus(); }
      } else {
        pole.blur();
      }
    }

    function pokazPasek() {
      if (pasekPisania) pasekPisania.classList.add("widoczny");
    }

    function ukryjPasek() {
      if (pasekPisania) pasekPisania.classList.remove("widoczny");
    }

    document.addEventListener("pointerdown", function (zdarzenie) {
      if (panel.classList.contains("widoczny")) return;
      if (pasekPisania && pasekPisania.contains(zdarzenie.target)) return;

      graChceTekstu = false;
      ustawFokus();

      // Gra rozstrzyga przy nastepnej klatce. Jesli nie poprosila o tekst,
      // zabieramy fokus — klawiatura nie zdazy sie rozwinac.
      setTimeout(function () {
        if (!graChceTekstu) {
          oddajFokusGrze();
          ukryjPasek();
        }
      }, 120);

      // Ostatnia deska ratunku: gra czeka na tekst, a klawiatury nie ma.
      setTimeout(function () {
        if (graChceTekstu && !klawiaturaOtwarta()) pokazPasek();
      }, 600);
    }, { capture: true, passive: true });

    // Pasek awaryjny. `pointerdown` + `preventDefault` trzyma gest przy nas,
    // wiec fokus na polu wypada dokladnie w chwili dotkniecia — a tego
    // Safari wymaga, zeby otworzyc klawiature.
    if (pasekPisania) {
      pasekPisania.addEventListener("pointerdown", function (zdarzenie) {
        zdarzenie.preventDefault();
        ustawFokus();
      });
    }

    // Gdy gra przestaje czekac na tekst, pasek jest juz niepotrzebny.
    pole.addEventListener("blur", function () {
      graChceTekstu = false;
      ukryjPasek();
    });

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", function () {
        if (klawiaturaOtwarta()) ukryjPasek();
      });
    }
  }

  /** Wolane po wczytaniu gry. */
  function przejmijFokus() {
    if (!odtwarzacz || panel.classList.contains("widoczny")) return;
    try { odtwarzacz.focus({ preventScroll: true }); } catch (e) { /* trudno */ }
  }

  // ------------------------------------------------- pelny ekran --

  /**
   * Pelny ekran i blokada orientacji wymagaja gestu uzytkownika — nie da sie
   * ich wlaczyc automatycznie. Podpinamy sie wiec pod pierwsze dotkniecie,
   * NIE przechwytujac go: klikniecie leci dalej do gry, a przy okazji
   * przegladarka chowa paski i blokuje orientacje poziomo.
   */
  function pelnyEkranPrzyPierwszymDotknieciu() {
    function sprobuj() {
      var el = document.documentElement;
      var zadanie = el.requestFullscreen || el.webkitRequestFullscreen;

      if (zadanie) {
        try {
          var p = zadanie.call(el, { navigationUI: "hide" });
          if (p && p.then) {
            p.then(zablokujPoziomo).catch(function () {});
          } else {
            zablokujPoziomo();
          }
        } catch (e) { /* przegladarka moze odmowic — to nie jest blad krytyczny */ }
      }
    }

    function zablokujPoziomo() {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock("landscape").catch(function () {
          // iOS nie wspiera blokady — gracz obraca telefon sam.
        });
      }
    }

    window.addEventListener("pointerdown", sprobuj, { once: true, passive: true });
  }

  // ------------------------------------------------------------ gra --

  function czekajNaRuffle(proba) {
    if (window.RufflePlayer && window.RufflePlayer.newest) { uruchom(); return; }
    if (proba > 120) {
      pokazBlad("Nie udalo sie wczytac Ruffle — odtwarzacza uruchamiajacego gre.<br>" +
                "Sprawdz polaczenie albo blokade skryptow.<br><br>" +
                "<a href='?debug=1'>Diagnostyka</a>");
      return;
    }
    setTimeout(function () { czekajNaRuffle(proba + 1); }, 100);
  }

  function uruchom() {
    var player;

    try {
      var ruffle = window.RufflePlayer.newest();
      player = ruffle.createPlayer();
      odtwarzacz = player;
      document.getElementById("gra").appendChild(player);
    } catch (e) {
      pokazBlad("Blad uruchamiania odtwarzacza:<br>" + e);
      return;
    }

    player.addEventListener("error", function (e) {
      pokazBlad("Ruffle nie poradzil sobie z plikiem gry.<br>" +
                (e && e.message ? e.message : "") +
                "<br><br><a href='?debug=1'>Diagnostyka</a>");
    });

    player.load({
      url: SWF,

      // Bez tego przegladarka wstrzymuje odtwarzanie i Ruffle pokazuje
      // wlasny duzy przycisk odtwarzania na czarnym tle. Start wyciszony
      // jest dozwolony bez gestu uzytkownika, a dzwieku gra i tak nie uzywa
      // na ekranie logowania.
      autoplay: "on",
      unmuteOverlay: "hidden",
      splashScreen: false,

      // Scena gry ma 1280x800 (proporcje 16:10), a ekran telefonu w poziomie
      // bywa duzo szerszy — na iPhonie Pro Max to 2,17:1. Przy `showAll` gra
      // dopasowuje sie wysokoscia, a po bokach zostaja szerokie czarne pasy.
      //
      // `exactFit` rozciaga obraz na cala dostepna powierzchnie. Postacie sa
      // wtedy odrobine szersze niz w oryginale — to cena za wykorzystanie
      // calego ekranu. `forceScale` jest konieczne, bo bez niego wygrywa
      // ustawienie sceny z samego pliku SWF.
      //
      // Kto woli wierne proporcje, dopisuje `?proporcje=1` do adresu.
      scale: proporcje ? "showAll" : "exactFit",
      forceScale: !proporcje,
      letterbox: proporcje ? "on" : "off",

      allowScriptAccess: true,
      backgroundColor: "#000000",
      quality: "high",
      wmode: "opaque",
      menu: false,
      salign: proporcje ? "t" : ""
    }).then(function () {
      przejmijFokus();
      podepnijKlawiature(player);
    }).catch(function (err) {
      pokazBlad("Nie udalo sie wczytac pliku gry <code>" + SWF + "</code>.<br>" +
                String(err) + "<br><br><a href='?debug=1'>Diagnostyka</a>");
    });

    pelnyEkranPrzyPierwszymDotknieciu();
  }

  if (debug) {
    if (window.RufflePlayer) uruchomDiagnostyke();
    else setTimeout(uruchomDiagnostyke, 2500);
  } else {
    czekajNaRuffle(0);
  }
})();
</script>

</body>
</html>
